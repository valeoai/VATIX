[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vatix"
version = "0.1.0"
description = "Flow-matching video diffusion training and inference for driving data"
readme = "README.md"
license = "MIT"
license-files = ["licenses/LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Victor Besnier", email = "victor.besnier@valeo.com" }
]
dependencies = [
  "accelerate",
  "av",
  "clean-fid",
  "diffusers",
  "easydict",
  "einops",
  "ftfy",
  "huggingface_hub",
  "hydra-core",
  "imageio",
  "jupyterlab",
  "loguru",
  "mediapy",
  "moviepy==1.0.3",
  "numpy<2",
  "pandas",
  "pyarrow",
  "scikit-learn",
  "sentencepiece",
  "tensorboard==2.16.2",
  "torch-fidelity",
  "torchcodec==0.10",
  "torchmetrics",
  "transformers",
  "webdataset",
]

[project.optional-dependencies]
torch = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "torchaudio==2.8.0",
]

[project.urls]
Homepage = "https://github.com/valeoai/VATIX"
Documentation = "https://valeoai.github.io/VATIX/"

[tool.setuptools]
include-package-data = true
py-modules = ["main"]

[tool.setuptools.data-files]
"conf" = ["conf/config.yaml"]
"conf/experiment" = [
  "conf/experiment/base.yaml",
  "conf/experiment/multi_gpu_ddp.yaml",
  "conf/experiment/multi_gpu_fsdp.yaml",
  "conf/experiment/flagship9b_traj.yaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vatix*"]
